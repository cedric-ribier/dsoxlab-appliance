name: Build & Release dsoxlab-runtime

on:
  # Cadence mensuelle — voir PLAN.md §1.5 : build tenté chaque mois,
  # publication conditionnelle seulement si le contenu a changé.
  schedule:
    - cron: '0 3 1 * *'   # 1er du mois, 03h00 UTC
  # Déclenchement manuel pour tester ou forcer une publication
  workflow_dispatch:
    inputs:
      force_publish:
        description: 'Publier même si aucun changement détecté'
        type: boolean
        default: false
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    # Runner self-hosted requis : virtualbox-iso a besoin de
    # VirtualBox installé, ce que les runners GitHub-hosted standards
    # n'offrent pas nativement.
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Installer Packer
        run: |
          curl -fsSL https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp.gpg
          echo "deb [signed-by=/usr/share/keyrings/hashicorp.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt-get update
          sudo apt-get install -y packer virtualbox

      - name: Déterminer la version
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(date +'%Y.%m.0')
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: packer init
        working-directory: packer
        run: packer init .

      - name: packer validate
        working-directory: packer
        run: packer validate -var "image_version=${{ steps.version.outputs.version }}" dsoxlab-runtime.pkr.hcl

      - name: packer build
        working-directory: packer
        run: packer build -var "image_version=${{ steps.version.outputs.version }}" dsoxlab-runtime.pkr.hcl

      - name: Vérifier la taille de l'OVA (limite 2 Go GitHub Release)
        id: size_check
        working-directory: packer/output/dsoxlab-runtime-${{ steps.version.outputs.version }}
        run: |
          SIZE_BYTES=$(stat -c%s *.ova)
          SIZE_MB=$((SIZE_BYTES / 1024 / 1024))
          echo "Taille OVA : ${SIZE_MB} Mo"
          echo "size_mb=$SIZE_MB" >> "$GITHUB_OUTPUT"
          if [ "$SIZE_BYTES" -gt 2000000000 ]; then
            echo "::warning::OVA dépasse 2 Go (${SIZE_MB} Mo) — compression requise avant publication, voir PLAN.md §1.3"
            echo "needs_compression=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_compression=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Comparer au contenu de la dernière Release publiée
        id: diff_check
        if: github.event_name == 'schedule'
        run: |
          LATEST_SHA=$(gh release view --json body -q '.body' 2>/dev/null | grep -oP 'content-hash: \K\w+' || echo "none")
          CURRENT_SHA=$(sha256sum packer/output/dsoxlab-runtime-${{ steps.version.outputs.version }}/manifest.json | cut -d' ' -f1)
          echo "current_sha=$CURRENT_SHA" >> "$GITHUB_OUTPUT"
          if [ "$LATEST_SHA" == "$CURRENT_SHA" ] && [ "${{ github.event.inputs.force_publish }}" != "true" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Aucun changement détecté depuis la dernière Release — pas de publication ce mois-ci."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Attestation de build (provenance)
        if: github.event_name == 'push' || steps.diff_check.outputs.publish == 'true'
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: 'packer/output/dsoxlab-runtime-${{ steps.version.outputs.version }}/*.ova'

      - name: Publier sur GitHub Releases
        if: github.event_name == 'push' || steps.diff_check.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          body: |
            content-hash: ${{ steps.diff_check.outputs.current_sha }}
            Taille OVA : ${{ steps.size_check.outputs.size_mb }} Mo
          files: |
            packer/output/dsoxlab-runtime-${{ steps.version.outputs.version }}/*.ova
            packer/output/dsoxlab-runtime-${{ steps.version.outputs.version }}/SHA256SUMS
