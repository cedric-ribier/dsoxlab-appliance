name: Build & Release dsoxlab-appliance

on:
  # Cadence mensuelle — voir PLAN.md §1.5 : build tenté chaque mois,
  # publication conditionnelle seulement si le contenu a changé.
  schedule:
    - cron: '0 3 1 * *'   # 1er du mois, 03h00 UTC
  # Déclenchement manuel pour tester ou forcer une publication
  workflow_dispatch:
    inputs:
      force_publish:
        description: 'Publier même si aucun changement détecté'
        type: boolean
        default: false
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    # Runner self-hosted requis : virtualbox-iso a besoin de
    # VirtualBox installé, ce que les runners GitHub-hosted standards
    # n'offrent pas nativement.
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Vérifier que Packer, VirtualBox, gh et plumber sont installés
        run: |
          # Le runner self-hosted doit avoir ces outils déjà installés
          # à une version précise, choisie et mise à jour délibérément
          # par la personne qui l'administre — pas réinstallés/mis à
          # jour silencieusement à chaque run CI. Un `apt-get install`
          # sans version épinglée à chaque exécution cassait la
          # reproductibilité des builds (chaque run pouvait utiliser
          # une version différente de Packer selon la date) et
          # élargissait inutilement la surface d'attaque (confiance
          # aveugle au dépôt HashiCorp à chaque exécution, sur un
          # runner persistant qui n'a besoin d'installer qu'une seule
          # fois). Voir PLAN.md, questions ouvertes.
          command -v packer >/dev/null 2>&1 || { echo "::error::packer introuvable sur ce runner — à installer manuellement, voir RELEASE.md"; exit 1; }
          command -v VBoxManage >/dev/null 2>&1 || { echo "::error::VBoxManage introuvable sur ce runner — VirtualBox à installer manuellement, voir RELEASE.md"; exit 1; }
          command -v gh >/dev/null 2>&1 || { echo "::error::gh (GitHub CLI) introuvable sur ce runner — à installer manuellement, voir RELEASE.md"; exit 1; }
          command -v plumber >/dev/null 2>&1 || { echo "::error::plumber introuvable sur ce runner — à installer manuellement, voir RELEASE.md"; exit 1; }
          command -v qemu-img >/dev/null 2>&1 || { echo "::error::qemu-img introuvable sur ce runner — à installer manuellement (paquet qemu-utils), voir RELEASE.md"; exit 1; }
          echo "Packer : $(packer version)"
          echo "VirtualBox : $(VBoxManage --version)"
          echo "gh : $(gh --version | head -1)"
          echo "plumber : $(plumber --version 2>&1 | head -1)"
          echo "qemu-img : $(qemu-img --version | head -1)"

      - name: Contrôle de conformité CI (Plumber) — avant le build coûteux
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Placé avant packer build (20+ min) pour échouer vite en cas
          # de régression de sécurité CI, plutôt que de gaspiller du
          # temps de build. --score-push publie le badge public une
          # fois que ce workflow tourne réellement en CI (no-op en
          # local, nécessite le jeton OIDC — voir PLAN.md). Seuil B
          # plutôt que A : bloque les vraies régressions (n'importe
          # quel Critical ou plusieurs High) sans être cassant pour un
          # simple finding mineur isolé.
          plumber analyze --score-push --min-score B

      - name: Déterminer la version
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(date +'%Y.%m.0')
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: packer init
        working-directory: packer
        run: packer init .

      - name: packer validate
        working-directory: packer
        run: packer validate -var "image_version=${{ steps.version.outputs.version }}" .

      - name: packer build
        working-directory: packer
        run: packer build -var "image_version=${{ steps.version.outputs.version }}" .

      - name: Vérifier la taille de l'OVA (limite 2 Go GitHub Release)
        id: size_check
        working-directory: packer/output/dsoxlab-appliance-${{ steps.version.outputs.version }}
        run: |
          SIZE_BYTES=$(stat -c%s *.ova)
          SIZE_MB=$((SIZE_BYTES / 1024 / 1024))
          echo "Taille OVA : ${SIZE_MB} Mo"
          echo "size_mb=$SIZE_MB" >> "$GITHUB_OUTPUT"
          if [ "$SIZE_BYTES" -gt 2000000000 ]; then
            echo "::warning::OVA dépasse 2 Go (${SIZE_MB} Mo) — compression requise avant publication, voir PLAN.md §1.3"
            echo "needs_compression=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_compression=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Comparer au contenu de la dernière Release publiée
        id: diff_check
        if: github.event_name == 'schedule'
        run: |
          LATEST_SHA=$(gh release view --json body -q '.body' 2>/dev/null | grep -oP 'content-hash: \K\w+' || echo "none")
          CURRENT_SHA=$(sha256sum packer/output/dsoxlab-appliance-${{ steps.version.outputs.version }}/manifest.json | cut -d' ' -f1)
          echo "current_sha=$CURRENT_SHA" >> "$GITHUB_OUTPUT"
          if [ "$LATEST_SHA" == "$CURRENT_SHA" ] && [ "${{ github.event.inputs.force_publish }}" != "true" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Aucun changement détecté depuis la dernière Release — pas de publication ce mois-ci."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Attestation de build (provenance)
        if: github.event_name == 'push' || steps.diff_check.outputs.publish == 'true'
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            packer/output/dsoxlab-appliance-${{ steps.version.outputs.version }}/*.ova
            packer/output/dsoxlab-appliance-${{ steps.version.outputs.version }}/*.qcow2

      - name: Publier sur GitHub Releases
        if: github.event_name == 'push' || steps.diff_check.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Appel direct à gh plutôt que l'action tierce
          # softprops/action-gh-release — signalée par Plumber comme
          # non épinglée par SHA (ISSUE-701) et hors des origines
          # autorisées (ISSUE-713). Élimine les deux d'un coup plutôt
          # que d'épingler une dépendance tierce évitable ; gh est déjà
          # utilisé de la même façon dans la procédure manuelle
          # documentée dans RELEASE.md.
          gh release create "v${{ steps.version.outputs.version }}" \
            "packer/output/dsoxlab-appliance-${{ steps.version.outputs.version }}/dsoxlab-appliance-${{ steps.version.outputs.version }}.ova" \
            "packer/output/dsoxlab-appliance-${{ steps.version.outputs.version }}/dsoxlab-appliance-${{ steps.version.outputs.version }}.qcow2" \
            "packer/output/dsoxlab-appliance-${{ steps.version.outputs.version }}/SHA256SUMS" \
            --title "v${{ steps.version.outputs.version }}" \
            --notes "content-hash: ${{ steps.diff_check.outputs.current_sha }}
          Taille OVA : ${{ steps.size_check.outputs.size_mb }} Mo"
