name: Build & Release dsoxlab-appliance

on:
  # Release à la main : pousser un tag vX.Y.Z construit ET publie.
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  # Build d'essai sur n'importe quelle branche : ne publie jamais.
  workflow_dispatch:

permissions: {}

jobs:
  build:
    # Runner self-hosted requis : virtualbox-iso a besoin de
    # VirtualBox installé, ce que les runners GitHub-hosted standards
    # n'offrent pas nativement.
    runs-on: self-hosted
    permissions:
      contents: write      # gh release create (+ lecture pour checkout)
      id-token: write      # OIDC : attestation de provenance, plumber --score-push
      attestations: write  # attest-build-provenance

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Vérifier que Packer, VirtualBox, gh et plumber sont installés
        run: |
          # Le runner self-hosted doit avoir ces outils déjà installés
          # à une version précise, choisie et mise à jour délibérément
          # par la personne qui l'administre — pas réinstallés/mis à
          # jour silencieusement à chaque run CI. Un `apt-get install`
          # sans version épinglée à chaque exécution cassait la
          # reproductibilité des builds (chaque run pouvait utiliser
          # une version différente de Packer selon la date) et
          # élargissait inutilement la surface d'attaque (confiance
          # aveugle au dépôt HashiCorp à chaque exécution, sur un
          # runner persistant qui n'a besoin d'installer qu'une seule
          # fois). Voir PLAN.md, questions ouvertes.
          command -v packer >/dev/null 2>&1 || { echo "::error::packer introuvable sur ce runner — à installer manuellement, voir RELEASE.md"; exit 1; }
          command -v VBoxManage >/dev/null 2>&1 || { echo "::error::VBoxManage introuvable sur ce runner — VirtualBox à installer manuellement, voir RELEASE.md"; exit 1; }
          command -v gh >/dev/null 2>&1 || { echo "::error::gh (GitHub CLI) introuvable sur ce runner — à installer manuellement, voir RELEASE.md"; exit 1; }
          command -v plumber >/dev/null 2>&1 || { echo "::error::plumber introuvable sur ce runner — à installer manuellement, voir RELEASE.md"; exit 1; }
          command -v qemu-img >/dev/null 2>&1 || { echo "::error::qemu-img introuvable sur ce runner — à installer manuellement (paquet qemu-utils), voir RELEASE.md"; exit 1; }
          echo "Packer : $(packer version)"
          echo "VirtualBox : $(VBoxManage --version)"
          echo "gh : $(gh --version | head -1)"
          echo "plumber : $(plumber --version 2>&1 | head -1)"
          echo "qemu-img : $(qemu-img --version | head -1)"

      - name: Contrôle de conformité CI (Plumber) — avant le build coûteux
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Placé avant packer build (20+ min) pour échouer vite en cas
          # de régression de sécurité CI, plutôt que de gaspiller du
          # temps de build. --score-push publie le badge public une
          # fois que ce workflow tourne réellement en CI (no-op en
          # local, nécessite le jeton OIDC — voir PLAN.md). Seuil B
          # plutôt que A : bloque les vraies régressions (n'importe
          # quel Critical ou plusieurs High) sans être cassant pour un
          # simple finding mineur isolé.
          plumber analyze --score-push --min-score B

      - name: Déterminer la version
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            VERSION="${REF_NAME#v}"
            [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
              || { echo "::error::tag « $REF_NAME » hors convention vX.Y.Z"; exit 1; }
          else
            VERSION="0.0.0-essai.${RUN_NUMBER}"   # build d'essai, jamais publié
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: packer init
        working-directory: packer
        run: packer init .

      - name: packer validate
        working-directory: packer
        run: packer validate -var "image_version=${{ steps.version.outputs.version }}" -var "providers=none" .

      - name: packer build
        working-directory: packer
        run: packer build -var "image_version=${{ steps.version.outputs.version }}" -var "providers=none" .

      - name: Vérifier la taille de l'OVA (limite 2 Go GitHub Release)
        id: size_check
        working-directory: packer/output/dsoxlab-appliance-${{ steps.version.outputs.version }}
        run: |
          SIZE_BYTES=$(stat -c%s *.ova 2>/dev/null || stat -f%z *.ova)
          SIZE_MB=$((SIZE_BYTES / 1024 / 1024))
          echo "Taille OVA : ${SIZE_MB} Mo"
          echo "size_mb=$SIZE_MB" >> "$GITHUB_OUTPUT"
          if [ "$SIZE_BYTES" -gt 2000000000 ]; then
            echo "::warning::OVA dépasse 2 Go (${SIZE_MB} Mo) — compression requise avant publication, voir PLAN.md §1.3"
            echo "needs_compression=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_compression=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Budget de taille
        # Un BUDGET, pas la limite de 2 Go des Releases : 611 Mo mesurés
        # (discard/fstrim + un seul noyau). Un dépassement signale une
        # régression du nettoyage, pas une image qui aurait grossi.
        working-directory: packer/output/dsoxlab-appliance-${{ steps.version.outputs.version }}
        env:
          BUDGET_MIB: 800
        run: |
          depasse=0
          for f in *.ova *.qcow2; do
            mib=$(( $(stat -f%z "$f") / 1024 / 1024 ))
            echo "$f : ${mib} MiB (budget ${BUDGET_MIB})"
            if [ "$mib" -gt "$BUDGET_MIB" ]; then
              echo "::error::$f dépasse le budget — vérifier la sortie de fstrim et la purge des noyaux"
              depasse=1
            fi
          done
          exit "$depasse"

      - name: SHA256SUMS doit se vérifier
        # La commande que l'utilisateur lancera après téléchargement :
        # si elle échoue ici, elle échouera chez lui.
        working-directory: packer/output/dsoxlab-appliance-${{ steps.version.outputs.version }}
        run: shasum -a 256 -c SHA256SUMS

      - name: L'OVA doit s'importer dans VMware (ovftool)
        # Le défaut de l'OVA 0.2.5 de dsoxlab (SHA du VMDK refusé par
        # VMware) n'était visible qu'à l'import : on importe donc pour de
        # vrai. Obligatoire pour une release, simple avertissement en essai.
        working-directory: packer/output/dsoxlab-appliance-${{ steps.version.outputs.version }}
        run: |
          OVFTOOL="/Applications/VMware Fusion.app/Contents/Library/VMware OVF Tool/ovftool"
          if [ ! -x "$OVFTOOL" ]; then
            echo "::warning::ovftool absent — import VMware non vérifié"
            [ "$GITHUB_EVENT_NAME" = "push" ] && exit 1
            exit 0
          fi
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          # --lax : VirtualBox déclare la famille matérielle « virtualbox-2.2 »,
          # que VMware refuse en strict. C'est l'équivalent du « Réessayer »
          # proposé par Fusion à l'import. --lax ne désactive PAS le contrôle
          # du manifest (vérifié : l'OVA 0.2.5 de dsoxlab échoue toujours).
          "$OVFTOOL" --lax --acceptAllEulas *.ova "$tmp/test.vmx"

      - name: Attestation de build (provenance)
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            packer/output/dsoxlab-appliance-${{ steps.version.outputs.version }}/*.ova
            packer/output/dsoxlab-appliance-${{ steps.version.outputs.version }}/*.qcow2

      - name: Publier sur GitHub Releases
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          SIZE_MB: ${{ steps.size_check.outputs.size_mb }}
        run: |
          # Appel direct à gh plutôt que l'action tierce
          # softprops/action-gh-release — signalée par Plumber comme
          # non épinglée par SHA (ISSUE-701) et hors des origines
          # autorisées (ISSUE-713). Élimine les deux d'un coup plutôt
          # que d'épingler une dépendance tierce évitable ; gh est déjà
          # utilisé de la même façon dans la procédure manuelle
          # documentée dans RELEASE.md.
          #
          # --verify-tag : refuse de créer le tag s'il n'existe pas déjà
          # sur le dépôt. La Release ne peut naître que d'un tag poussé.
          DIR="packer/output/dsoxlab-appliance-${VERSION}"
          # Brouillon d'abord, envoi des fichiers UN PAR UN avec reprise,
          # publication en dernier. Un envoi qui échoue laisse un brouillon
          # invisible du public, jamais une Release incomplète.
          gh release create "v${VERSION}" --verify-tag --draft \
            --title "v${VERSION}" --notes "Taille OVA : ${SIZE_MB} Mo"

          for f in "${DIR}/SHA256SUMS" \
                   "${DIR}/dsoxlab-appliance-${VERSION}.ova" \
                   "${DIR}/dsoxlab-appliance-${VERSION}.qcow2"; do
            for essai in 1 2 3; do
              echo "Envoi de $(basename "$f") (essai ${essai}/3)…"
              if gh release upload "v${VERSION}" "$f" --clobber; then
                break
              fi
              [ "$essai" -eq 3 ] && { echo "::error::échec de l'envoi de $(basename "$f") après 3 essais — le brouillon v${VERSION} reste à supprimer"; exit 1; }
              sleep 30
            done
          done

          gh release edit "v${VERSION}" --draft=false --latest
