name: Plumber

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  plumber:
    runs-on: ubuntu-24.04
    permissions:
      contents: read          # checkout
      security-events: write  # upload du SARIF vers l'onglet Security

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Plumber — analyse CI/CD + upload SARIF
        uses: getplumber/plumber@fb943e4efba61cf7b0a0c56f6648710a7453519b # v0.5.20
        with:
          # Reprend le .plumber.yaml déjà commité à la racine (auto-détecté).
          min-score: B      # même seuil que le gate CLI dans build-release.yml
          soft-fail: true   # ne bloque pas la PR — les findings remontent dans Security,
                             # le gate bloquant reste build-release.yml avant le build packer
          score-push: false # le badge public est déjà poussé par le job de release
          upload-sarif: true
